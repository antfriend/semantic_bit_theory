repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-json
        name: Check JSON syntax in examples
        files: ^examples/(?!invalid/).+\.json$

  - repo: local
    hooks:
      - id: validate-semantic-bits
        name: Validate Semantic Bit JSON
        entry: python tools/validate.py
        language: python
        types: [json]
        files: ^examples/(?!invalid/).+\.json$
        additional_dependencies:
          - jsonschema

