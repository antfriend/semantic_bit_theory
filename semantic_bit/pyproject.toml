[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-bit"
version = "0.1.0"
description = "Generate structured JSON metadata for up to 5000 characters of text."
readme = "README.md"
authors = [{ name = "Dan Ray, Gregory Blacketter" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["text", "analysis", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
semantic-bit = "semantic_bit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/antfriend/semantic_bit_theory/blob/main/README.md"
Repository = "https://github.com/antfriend/semantic_bit_theory"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
