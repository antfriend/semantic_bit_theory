name: Validate Semantic Bit Examples

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate valid examples
        run: |
          python tools/validate.py examples/*.json

      - name: Validate invalid examples (should fail)
        shell: bash
        run: |
          set -e
          if python tools/validate.py examples/invalid/*.json; then
            echo "Expected invalid examples to fail, but they passed." >&2
            exit 1
          else
            echo "Invalid examples failed as expected."
          fi

